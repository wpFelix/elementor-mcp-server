name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked
      - run: composer test
      - run: composer lint
      - run: composer analyze

  php-8-0:
    name: PHP 8.0 install and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.0"
          coverage: none
      - run: composer install --no-dev --no-interaction --prefer-dist
      - name: Parse release PHP on the declared minimum
        run: find . -name '*.php' -not -path './vendor/*' -not -path './tests/*' -not -path './build/*' -print0 | xargs -0 -n1 php -l

  frontend:
    name: Reproducible chat build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Built assets match source
        run: git diff --exit-code -- includes/assets/chat

  package:
    name: Release ZIP
    runs-on: ubuntu-latest
    needs: [test, php-8-0, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer install --no-dev --no-interaction --prefer-dist
      - run: bash scripts/package.sh
      - run: unzip -t build/elementor-mcp.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: elementor-mcp
          path: build/elementor-mcp.zip
          if-no-files-found: error
